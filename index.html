<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4a77f">
  <title>예종 음악 놀이터</title>
  <meta name="description" content="초등학생을 위한 음악 게임: 계이름 맞히기, 높은 소리 낮은 소리, 리듬 따라치기, 건반 따라치기">
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 홈 -->
  <section id="home" class="screen">
    <header class="hero">
      <img class="logo" id="homeLogo" src="logo.png" alt="예종피아노음악학원" width="120" height="120">
      <h1>예종 음악 놀이터</h1>
      <p>게임으로 배우는 계이름 · 리듬 · 소리</p>
    </header>
    <div class="timer-line" id="timerLine"></div>
    <div class="grade" role="radiogroup" aria-label="학년">
      <button data-grade="low" class="on">🐣 1~3학년</button>
      <button data-grade="high">🦁 4~6학년</button>
    </div>
    <div id="cards" class="cards"></div>
    <p class="tip">🔈 소리가 안 나면 무음 모드를 꺼 주세요</p>
    <button class="reset-btn" id="resetBtn">🔄 시간·별 초기화 (선생님)</button>
    <footer class="copy"><img src="icon-180.png" alt="" width="28" height="28"> © <span class="yr"></span> 예종피아노음악학원. All rights reserved.</footer>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen" hidden>
    <div class="bar">
      <button id="back" class="icon-btn" aria-label="홈으로">←</button>
      <div class="bar-title" id="gTitle"></div>
      <div class="gtimer" id="gTimer"></div>
      <div class="score"><span id="gCombo" class="combo"></span><span id="gScore">0</span>점</div>
    </div>
    <div class="progress"><div id="gProg"></div></div>
    <div id="stage" class="stage"></div>
    <div id="toast" class="toast"></div>
    <footer class="copy small">© <span class="yr"></span> 예종피아노음악학원</footer>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen" hidden>
    <div class="result-card">
      <div id="rStars" class="stars big"></div>
      <h2 id="rTitle"></h2>
      <p id="rMsg"></p>
      <div class="result-btns">
        <button id="again" class="btn primary">다시 하기</button>
        <button id="home2" class="btn">다른 게임</button>
      </div>
    </div>
    <footer class="copy">© <span class="yr"></span> 예종피아노음악학원</footer>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </section>

  <!-- 놀이 시간 끝 -->
  <section id="timeup" class="screen" hidden>
    <div class="result-card">
      <div class="moon">🌙</div>
      <h2>오늘 놀이 시간 끝!</h2>
      <p>15분 동안 열심히 했어요. 수고했어요! 👏</p>
      <div id="pinLock"><div class="pin-box">
        <div class="pin-label">🔒 선생님 비밀번호</div>
        <div class="pin-dots"><i></i><i></i><i></i><i></i></div>
        <div class="pin-msg"></div>
        <div class="pin-pad">
          <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button><button class="blank" disabled></button><button>0</button><button data-del>⌫</button>
        </div>
      </div></div>
    </div>
    <footer class="copy">© <span class="yr"></span> 예종피아노음악학원</footer>
  </section>

  <!-- 선생님: 시간·별 초기화 -->
  <div id="resetModal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-x" id="resetClose" aria-label="닫기">✕</button>
      <h3>🔄 다음 학생 시작</h3>
      <p class="muted-p">놀이 시간 15분과 별 기록을 모두 처음으로 되돌려요</p>
      <div id="pinReset"><div class="pin-box">
        <div class="pin-label">🔒 선생님 비밀번호</div>
        <div class="pin-dots"><i></i><i></i><i></i><i></i></div>
        <div class="pin-msg"></div>
        <div class="pin-pad">
          <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
          <button>7</button><button>8</button><button>9</button><button class="blank" disabled></button><button>0</button><button data-del>⌫</button>
        </div>
      </div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
